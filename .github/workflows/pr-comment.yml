name: PRComment

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  authorize:
    permissions: {}
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '$terraform')
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.get-roles.outputs.roles }}
    steps:
      - name: Get Roles
        id: get-roles
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          APPLIERS: ${{ vars.APPLIERS }}
        run: |
          if echo "$APPLIERS" | jq -e --arg actor "$ACTOR" --arg triggering_actor "$TRIGGERING_ACTOR" 'any(.[]; . == $actor) and any(.[]; . == $triggering_actor)' > /dev/null 2>&1; then
            ROLES='["applier"]'
          else
            ROLES='["planner"]'
          fi
          echo "roles=$ROLES" >> "$GITHUB_OUTPUT"

  setup:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.set-matrix.outputs.command }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tf_targets_json: ${{ steps.set-matrix.outputs.tf_targets_json }}
      head_sha: ${{ steps.pr-details.outputs.head_sha }}
      done: ${{ steps.set-matrix.outputs.done }}
    steps:

      - name: Add reaction
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Get PR Details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR info (baseRefOid, headRefOid)
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefOid,headRefOid)
          echo "base_sha=$(echo "$PR_DATA" | jq -r .baseRefOid)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_DATA" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch PR Head
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Parse Comment and Generate Matrix
        id: set-matrix
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_SHA: ${{ steps.pr-details.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
          ROLES: ${{ needs.authorize.outputs.roles }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          if git cat-file -e "${HEAD_SHA}:.tfdeps.json" 2>/dev/null; then
            git show "${HEAD_SHA}:.tfdeps.json" > .tfdeps.json
          fi
          node .github/tfman/cli/index.mjs operate-command \
            --comment-body "$COMMENT_BODY" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --roles "$ROLES" \
            --actor "$ACTOR" \
            --github-output "$GITHUB_OUTPUT"

      - name: Post Command Result If Need
        if: steps.set-matrix.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.set-matrix.outputs.message }}
        run: gh pr comment ${{ github.event.issue.number }} --body "$MESSAGE"

      - name: Set Pending Status
        if: steps.set-matrix.outputs.done != 'true' && steps.set-matrix.outputs.matrix != '' && fromJson(steps.set-matrix.outputs.matrix).include[0] != null
        uses: actions/github-script@v8
        env:
          COMMAND: ${{ steps.set-matrix.outputs.command }}
          HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: `terraform/${process.env.COMMAND}`,
              description: `Terraform ${process.env.COMMAND} is running...`,
              target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`
            });

  run:
    permissions:
      id-token: write
      contents: read
    needs: [authorize, setup]
    if: needs.setup.outputs.done != 'true' && needs.setup.outputs.matrix != '' && fromJson(needs.setup.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    name: run on ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.head_sha }}

      - name: Create Cache Dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Load .env
        env:
          TF_ROOT: ${{ matrix.path }}
        run: |
          ENV_FILE="${GITHUB_WORKSPACE}/.github/env.d/${TF_ROOT}/.env"
          if [ -f "$ENV_FILE" ]; then
            awk '!/^[[:space:]]*(#|$)/' "$ENV_FILE" >> "$GITHUB_ENV"
          else
            echo ".env not found, skipping"
          fi

      - name: Configure AWS Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/aws') || contains(matrix.providers, 'registry.terraform.io/hashicorp/awscc')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Azure Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/azurerm') || contains(matrix.providers, 'registry.terraform.io/hashicorp/azuread') || contains(matrix.providers, 'registry.terraform.io/azure/azapi')
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_ALLOW_NO_SUBSCRIPTIONS }}

      - name: Configure GCP Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/google')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-plugin-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugin-

      - name: Read Terraform Version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        if: needs.setup.outputs.command == 'plan'
        id: plan
        env:
          TF_TARGETS_JSON: ${{ needs.setup.outputs.tf_targets_json }}
        run: |
          TARGET_FLAGS=()
          if [ "$TF_TARGETS_JSON" != "[]" ]; then
            while IFS= read -r addr; do
              TARGET_FLAGS+=("-target=$addr")
            done < <(echo "$TF_TARGETS_JSON" | jq -r '.[]')
          fi
          set -o pipefail
          # Keep the raw output (including errors) as plan.txt until the canonical rendering replaces it
          terraform plan -input=false -no-color -out=tfplan "${TARGET_FLAGS[@]}" 2>&1 | tee plan.txt
          # Display with color in logs
          terraform show tfplan
          # Save plain text for comment
          terraform show -no-color tfplan > plan.txt

      - name: Terraform Apply
        if: needs.setup.outputs.command == 'apply'
        id: apply
        env:
          ROLES: ${{ needs.authorize.outputs.roles }}
          ACTOR: ${{ github.event.comment.user.login }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          APPLIERS: ${{ vars.APPLIERS }}
          TF_TARGETS_JSON: ${{ needs.setup.outputs.tf_targets_json }}
        run: |
          if ! echo "$APPLIERS" | jq -e --arg actor "$TRIGGERING_ACTOR" 'any(.[]; . == $actor)' > /dev/null 2>&1; then
            echo "User $TRIGGERING_ACTOR does not have permission to apply. Required role: applier."
            exit 1
          fi
          if ! echo "$ROLES" | jq -e 'any(.[]; . == "applier")' > /dev/null; then
            echo "User $ACTOR does not have permission to apply. Required role: applier."
            exit 1
          fi
          TARGET_FLAGS=()
          if [ "$TF_TARGETS_JSON" != "[]" ]; then
            while IFS= read -r addr; do
              TARGET_FLAGS+=("-target=$addr")
            done < <(echo "$TF_TARGETS_JSON" | jq -r '.[]')
          fi
          set -o pipefail
          terraform apply -auto-approve -input=false -no-color "${TARGET_FLAGS[@]}" 2>&1 | tee apply.txt

      - name: Write Result
        if: always()
        id: meta
        env:
          TF_ROOT: ${{ matrix.path }}
        run: node "$GITHUB_WORKSPACE/.github/tfman/cli/index.mjs" write-result --path "$TF_ROOT" --command "${{ needs.setup.outputs.command }}" --outcome "${{ needs.setup.outputs.command == 'plan' && steps.plan.outcome || steps.apply.outcome }}"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ matrix.path }}/plan.txt
            ${{ matrix.path }}/apply.txt
            ${{ matrix.path }}/info.json
          if-no-files-found: ignore
          retention-days: 1

  post-run:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    needs: [setup, run]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.done != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.setup.outputs.command }}-*
          path: ${{ needs.setup.outputs.command == 'plan' && 'plans' || 'applies' }}
          merge-multiple: false

      - name: Update Commit Status
        if: always()
        uses: actions/github-script@v8
        env:
          COMMAND: ${{ needs.setup.outputs.command }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          JOB_RESULT: ${{ needs.run.result }}
        with:
          script: |
            const command = process.env.COMMAND;
            const result = process.env.JOB_RESULT;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: (result === 'success' || result === 'skipped') ? 'success' : result === 'cancelled' ? 'error' : 'failure',
              context: `terraform/${command}`,
              description: result === 'cancelled' ? `Terraform ${command} was cancelled` : result === 'success' ? 'All Terraform jobs passed' : 'Some Terraform jobs failed',
              target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`
            });

      - name: Post Command Execution Result
        if: always()
        uses: actions/github-script@v8
        env:
          MATRIX: ${{ needs.setup.outputs.matrix }}
          COMMAND: ${{ needs.setup.outputs.command }}
        with:
          script: |
            const command = process.env.COMMAND;
            const expectedPaths = process.env.MATRIX ? JSON.parse(process.env.MATRIX).include.map(i => i.path) : [];
            const { default: script } = await import('${{ github.workspace }}/.github/tfman/gh-scripts/post-comment.mjs');
            await script({ github, context, core, glob }, { expectedPaths, mode: command, deletePreviousComments: command === 'plan' });
