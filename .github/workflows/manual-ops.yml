name: ManualOps

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Target directories to apply (space-separated paths, e.g., account/dev account/prod)'
        required: true
        type: string
      tf_targets:
        description: 'Terraform resource targets (space-separated addresses, e.g., aws_instance.example module.frontend)'
        required: false
        type: string
        default: ''
      command:
        description: 'Terraform command to execute'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: apply

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.get-roles.outputs.roles }}
    steps:
      - name: Get Roles
        id: get-roles
        env:
          ACTOR: ${{ github.actor }}
          APPLIERS: ${{ vars.APPLIERS }}
        run: |
          if echo "$APPLIERS" | jq -e --arg actor "$ACTOR" 'contains([$actor])' > /dev/null 2>&1; then
            ROLES='["applier"]'
          else
            ROLES='["planner"]'
          fi
          echo "roles=$ROLES" >> $GITHUB_OUTPUT

  setup:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Parse Targets and Generate Matrix
        id: set-matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # Use the select-targets command to generate the matrix json
          # Wrap in { include: ... } and minify with jq -c
          MATRIX=$(node .github/scripts/cli/index.mjs select-targets --targets "$TARGETS" | jq -c '{include: .}')

          # Echo to stdout for logging and set as output
          echo "$MATRIX"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  run:
    needs: [authorize, setup]
    runs-on: ubuntu-latest
    name: run on ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Create Cache Dir
        run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - name: Load .env
        run: |
          ENV_FILE="${{ github.workspace }}/.github/env.d/${{ matrix.path }}/.env"
          if [ -f "$ENV_FILE" ]; then
            grep -v '^\s*#' "$ENV_FILE" | grep -v '^\s*$' >> "$GITHUB_ENV"
          else
            echo ".env not found, skipping"
          fi

      - name: Configure AWS Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/aws') || contains(matrix.providers, 'registry.terraform.io/hashicorp/awscc')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Azure Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/azurerm') || contains(matrix.providers, 'registry.terraform.io/hashicorp/azuread') || contains(matrix.providers, 'registry.terraform.io/azure/azapi')
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_ALLOW_NO_SUBSCRIPTIONS }}

      - name: Configure GCP Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/google')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-plugin-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugin-

      - name: Read Terraform Version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        if: inputs.command == 'plan'
        env:
          TF_TARGETS: ${{ inputs.tf_targets }}
        run: |
          TARGET_FLAGS=()
          for addr in $TF_TARGETS; do
            TARGET_FLAGS+=("-target=$addr")
          done
          terraform plan -input=false "${TARGET_FLAGS[@]}"

      - name: Terraform Apply
        if: inputs.command == 'apply'
        env:
          ROLES: ${{ needs.authorize.outputs.roles }}
          ACTOR: ${{ github.actor }}
          TF_TARGETS: ${{ inputs.tf_targets }}
        run: |
          if ! echo "$ROLES" | jq -e 'contains(["applier"])' > /dev/null; then
            echo "User $ACTOR does not have permission to apply. Required role: applier."
            exit 1
          fi
          TARGET_FLAGS=()
          for addr in $TF_TARGETS; do
            TARGET_FLAGS+=("-target=$addr")
          done
          terraform apply -auto-approve -input=false "${TARGET_FLAGS[@]}"
