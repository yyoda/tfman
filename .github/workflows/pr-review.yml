name: PRReview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Detect Changes
        id: set-matrix
        run: |
          set -euo pipefail
          CHANGES=$(node .github/tfman/cli/index.mjs detect-changes \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} | jq -c '{include: .}')
          echo "$CHANGES" | jq .
          {
            echo "matrix<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          HAS_CHANGES=$(echo "$CHANGES" | jq '.include | length > 0')
          echo "has-changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    name: plan on ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v5

      - name: Create Cache Dir
        run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - name: Load .env
        run: |
          ENV_FILE="${{ github.workspace }}/.github/env.d/${{ matrix.path }}/.env"
          if [ -f "$ENV_FILE" ]; then
            grep -v '^\s*#' "$ENV_FILE" | grep -v '^\s*$' >> "$GITHUB_ENV"
          else
            echo ".env not found, skipping"
          fi

      - name: Configure AWS Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/aws') || contains(matrix.providers, 'registry.terraform.io/hashicorp/awscc')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Azure Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/azurerm') || contains(matrix.providers, 'registry.terraform.io/hashicorp/azuread') || contains(matrix.providers, 'registry.terraform.io/azure/azapi')
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_ALLOW_NO_SUBSCRIPTIONS }}

      - name: Configure GCP Credentials
        if: contains(matrix.providers, 'registry.terraform.io/hashicorp/google')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-plugin-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugin-

      - name: Read Terraform Version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> $GITHUB_OUTPUT
        working-directory: ${{ matrix.path }}

      - name: Setup Terraform (Specific Version)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          # Keep the raw output (including errors) as plan.txt until the canonical rendering replaces it
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          # Display with colors in logs
          terraform show tfplan
          # Save plan to text for comment
          terraform show -no-color tfplan > plan.txt

      - name: Write Full Plan to Job Summary
        if: always()
        run: |
          if [ -f plan.txt ]; then
            {
              echo "## 📄 Terraform Plan — \`${{ matrix.path }}\`"
              echo ''
              echo '```hcl'
              # Neutralize any code fences in the output, then cap well under
              # the ~1 MiB Job Summary per-step limit.
              sed 's/```/~~~/g' plan.txt | head -c 900000
              echo ''
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Artifact Metadata
        if: always()
        id: meta
        run: |
          CLEAN_PATH="$(echo "${{ matrix.path }}" | tr '/' '-')-$(printf '%s' "${{ matrix.path }}" | sha256sum | cut -c1-8)"
          echo "clean_path=${CLEAN_PATH}" >> $GITHUB_OUTPUT
          echo "{\"path\": \"${{ matrix.path }}\", \"outcome\": \"${{ steps.plan.outcome == 'success' && 'success' || 'failure' }}\"}" > info.json

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ steps.meta.outputs.clean_path }}
          path: |
            ${{ matrix.path }}/plan.txt
            ${{ matrix.path }}/info.json
          if-no-files-found: error
          retention-days: 1

      - name: Setup Trivy
        if: ${{ !cancelled() && hashFiles('trivy.yaml') != '' }}
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.69.3

      - name: Trivy IaC scan (informational)
        if: ${{ !cancelled() && hashFiles('trivy.yaml') != '' }}
        id: trivy
        run: |
          trivy config . \
            --config "${{ github.workspace }}/trivy.yaml" \
            --skip-dirs '**/.terraform/**' \
            --format json --output trivy-report.json \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --quiet --skip-version-check || true
          CLEAN_PATH="$(echo "${{ matrix.path }}" | tr '/' '-')-$(printf '%s' "${{ matrix.path }}" | sha256sum | cut -c1-8)"
          echo "clean_path=${CLEAN_PATH}" >> "$GITHUB_OUTPUT"
          if [ -f trivy-report.json ]; then
            C=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
            H=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH")]     | length' trivy-report.json 2>/dev/null || echo 0)
            {
              echo "## 🔎 Trivy (informational) — \`${{ matrix.path }}\`"
              echo "CRITICAL: ${C}  HIGH: ${H}  — details in the \`trivy-*\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy report
        if: ${{ !cancelled() && hashFiles('trivy.yaml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ steps.trivy.outputs.clean_path }}
          path: ${{ matrix.path }}/trivy-report.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Setup TFLint
        if: ${{ !cancelled() && hashFiles('.tflint.hcl') != '' }}
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: Cache TFLint plugins
        if: ${{ !cancelled() && hashFiles('.tflint.hcl') != '' }}
        uses: actions/cache@v5
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: TFLint (fail on warning+)
        if: ${{ !cancelled() && hashFiles('.tflint.hcl') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint \
            --config="${{ github.workspace }}/.tflint.hcl" \
            --minimum-failure-severity=warning \
            --format=compact

  post-plan:
    needs: [detect-changes, plan]
    runs-on: ubuntu-latest
    if: always() && needs.detect-changes.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Download Plans
        if: needs.detect-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: plan-*
          path: plans
          merge-multiple: false

      - name: Post Plan Result
        uses: actions/github-script@v8
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { default: script } = await import('${{ github.workspace }}/.github/tfman/gh-scripts/post-comment.mjs');
            const hasChanges = '${{ needs.detect-changes.outputs.has-changes }}' === 'true';
            const expectedPaths = process.env.MATRIX ? JSON.parse(process.env.MATRIX).include.map(i => i.path) : [];
            await script({github, context, core, glob}, { expectedPaths, mode: 'plan', deletePreviousComments: true, cleanupOnly: !hasChanges });
